     🔴 01b-서버.js 는 싣지 않는다 — 로그인 화면으로 튕긴다. ZG.서버 를 여기서 흉내낸다 -->

 {품목코드:'VER01-15',접두:'VER01',유통명:'버들마편초',학명:'Verbena bonariensis',규격:'15cm',규격cm:15,매입단가:1500,과세구분:'면세'},
 {품목코드:'SAL01-15',접두:'SAL01',유통명:'무늬버들',  학명:'Salix integra',      규격:'15cm',규격cm:15,매입단가:2000,과세구분:'면세'}
]));
/* 원본 27칸 — edge-주문수집이 자동수집 줄에 같이 저장하는 그 배열이다 */
function 원본(주문번호,상품명,코드,수량,이름,우편,주소,전화){
 return ['카페24','',주문번호,'2026-08-10',상품명,'','',코드,'무통장','','',9900,수량,이름,우편,주소,전화,전화,전화,'',이름,'','','','',0,''];
}
var 줄들=[
 {id:'od_1',묶음id:'260810-01',주문번호:'20260810-0000001',주문일:'2026-08-10',판매처:'쿠팡',
  품목코드:'VER01-15',원본코드:'VER01-15',유통명:'버들마편초',규격:'15cm',주문수량:2,옵션입수:1,단가:9900,
  수령인:'홍길동',수령인전화:'010-1111-2222',수령인주소:'서울 강남구 1',우편번호:'06000',묶음키:'홍길동|010-1111-2222',
  출처:'자동수집',카페24상태:'배송준비중',원본:원본('20260810-0000001','버들마편초','VER01-15',2,'홍길동','06000','서울 강남구 1','010-1111-2222')},
 {id:'od_2',묶음id:'260810-01',주문번호:'20260810-0000002',주문일:'2026-08-10',판매처:'쿠팡',
  품목코드:'SAL01-15',원본코드:'SAL01-15',유통명:'무늬버들',규격:'15cm',주문수량:1,옵션입수:1,단가:9900,
  수령인:'김철수',수령인전화:'010-3333-4444',수령인주소:'부산 해운대 2',우편번호:'48000',묶음키:'김철수|010-3333-4444',
  출처:'자동수집',카페24상태:'배송준비중',원본:원본('20260810-0000002','무늬버들','SAL01-15',1,'김철수','48000','부산 해운대 2','010-3333-4444')},
 /* 원본이 없는 옛 주문 — 조용히 빠져야 한다 */
 {id:'od_3',묶음id:'260810-01',주문번호:'20260810-0000003',주문일:'2026-08-10',판매처:'심폴',
  품목코드:'VER01-15',유통명:'버들마편초',규격:'15cm',주문수량:1,옵션입수:1,단가:9900,
  수령인:'박영희',수령인전화:'010-5555-6666',수령인주소:'대구 중구 3',우편번호:'41900',묶음키:'박영희|010-5555-6666',출처:'심폴'}
];
localStorage.setItem('zg.v3.주문', JSON.stringify(줄들));
localStorage.setItem('zg.v3.주문묶음', JSON.stringify([{id:'260810-01',올린날:'2026-08-10',회차:1,줄수:3,출처:'자동수집'}]));
</script>

<script>
ZG.서버 = { 로그인됨:false, 클라이언트:null, 받아오기:null };
var 말=[], 튕김=0;
function 봐(이름,참){ if(!참)튕김++; 말.push((참?'OK  ':'🔴 FAIL ')+이름); }

var 항목 = [{원본:줄들[0].원본,줄:줄들[0],id:'od_1'},{원본:줄들[1].원본,줄:줄들[1],id:'od_2'}];
var 홍 = '홍길동|06000|01011112222';       // 08i.그룹키 = 이름+우편번호+전화(숫자만)
var 김 = '김철수|48000|01033334444';
var J=9, K=10, 이름칸=13;
/* 🔴 줄 순서는 「작업자가 포장하는 순서」로 정렬된다 — 자리로 찾지 말고 수령인으로 찾는다 */
function 줄뽑기(){ return ZG.로젠파일.준비(항목, {묶음id:'260810-01'}).표; }
function 찾(표, 이름){ return 표.filter(function(r){ return r[이름칸]===이름 && !/번 송장/.test(r[4]); })[0] || []; }

/* ① 손대지 않은 상태 — K열은 빈칸이어야 한다 (여태 나간 파일과 같아야 한다) */
var 표 = 줄뽑기(), ㅎ = 찾(표,'홍길동');
봐('손질 없음 → J=2750 (실제: '+ㅎ[J]+')', ㅎ[J]==='2750');
봐('손질 없음 → K열 빈칸 (실제: "'+ㅎ[K]+'")', ㅎ[K]==='');

/* ② 2750 × 2박스 — 우람님이 신고하신 그 건 */
ZG.운임손질.저장('260810-01', 홍, 1, {수령인:'홍길동', 단가:2750, 박스수:2, 자동값:'2750'});
표 = 줄뽑기(); ㅎ = 찾(표,'홍길동'); var ㄱ = 찾(표,'김철수');
봐('2750×2 → J=5500 (실제: '+ㅎ[J]+')', ㅎ[J]==='5500');
봐('2750×2 → K=2 (실제: "'+ㅎ[K]+'")', ㅎ[K]==='2');
봐('손 안 댄 다른 손님은 그대로 J=2750·K빈칸 (실제: '+ㄱ[J]+' · "'+ㄱ[K]+'")',
   ㄱ[J]==='2750' && ㄱ[K]==='');

/* ③ 2750 × 4박스 = 11000, 4 (우람님 8/12 확인) */
ZG.운임손질.저장('260810-01', 홍, 1, {수령인:'홍길동', 단가:2750, 박스수:4, 자동값:'2750'});
표 = 줄뽑기(); ㅎ = 찾(표,'홍길동');
봐('2750×4 → J=11000 · K=4 (실제: '+ㅎ[J]+' · "'+ㅎ[K]+'")', ㅎ[J]==='11000' && ㅎ[K]==='4');

/* ④ 박스수 1로 되돌리면 K열이 다시 빈칸이 된다 */
ZG.운임손질.저장('260810-01', 홍, 1, {수령인:'홍길동', 단가:3300, 박스수:1, 자동값:'2750'});
표 = 줄뽑기(); ㅎ = 찾(표,'홍길동');
봐('3300×1 → J=3300 · K빈칸 (실제: '+ㅎ[J]+' · "'+ㅎ[K]+'")', ㅎ[J]==='3300' && ㅎ[K]==='');

/* ⑤ 「송장 한 장 더」(차수 2) 도 자기 박스수를 K열에 갖는다 */
ZG.운임손질.저장('260810-01', 김, 2, {수령인:'김철수', 단가:2750, 박스수:3, 자동값:'2750'});
표 = 줄뽑기();
봐('추가 송장 줄이 하나 늘었다 (실제 줄수: '+표.length+')', 표.length===3);
var 추가 = 표.filter(function(r){ return /2번 송장/.test(r[4]); })[0];
봐('추가 송장 J=8250 · K=3 (실제: '+(추가&&추가[J])+' · "'+(추가&&추가[K])+'")',
   추가 && 추가[J]==='8250' && 추가[K]==='3');

/* ⑥ K열은 카페24 「결제정보」 자리다 — 원본에 값이 있어도 박스수로 덮는지 */
봐('27칸 수가 그대로 27 (실제: '+표[0].length+')', 표[0].length===27);
봐('추가 송장을 붙여도 원래 묶음 K열은 자기 값 그대로 (실제: "'+찾(표,'김철수')[K]+'")', 찾(표,'김철수')[K]==='');

document.getElementById('말').textContent = 말.join('\n')+'\n\n'+(튕김?'🔴 '+튕김+'건 실패':'✅ 전부 통과');
</script>
