  출처:'자동수집',카페24상태:'배송준비중',원본:원본('20260810-0000001','버들마편초','VER01-15',2,'홍길동','06000','서울 강남구 1','010-1111-2222')},
 {id:'od_2',묶음id:'260810-01',주문번호:'20260810-0000002',주문일:'2026-08-10',판매처:'쿠팡',
  품목코드:'SAL01-15',원본코드:'SAL01-15',유통명:'무늬버들',규격:'15cm',주문수량:1,옵션입수:1,단가:9900,
  수령인:'김철수',수령인전화:'010-3333-4444',수령인주소:'부산 해운대 2',우편번호:'48000',묶음키:'김철수|010-3333-4444',
  출처:'자동수집',카페24상태:'배송준비중',원본:원본('20260810-0000002','무늬버들','SAL01-15',1,'김철수','48000','부산 해운대 2','010-3333-4444')},
 /* 원본이 없는 옛 주문 — 조용히 빠져야 한다 */
 {id:'od_3',묶음id:'260810-01',주문번호:'20260810-0000003',주문일:'2026-08-10',판매처:'심폴',
  품목코드:'VER01-15',유통명:'버들마편초',규격:'15cm',주문수량:1,옵션입수:1,단가:9900,
  수령인:'박영희',수령인전화:'010-5555-6666',수령인주소:'대구 중구 3',우편번호:'41900',묶음키:'박영희|010-5555-6666',출처:'심폴'}
];
localStorage.setItem('zg.v3.주문', JSON.stringify(줄들));
localStorage.setItem('zg.v3.주문묶음', JSON.stringify([{id:'260810-01',올린날:'2026-08-10',회차:1,줄수:3,출처:'자동수집'}]));
</script>

<script>
ZG.서버 = { 로그인됨:false, 클라이언트:null, 받아오기:null };
var 말=[], 튕김=0;
function 봐(이름,참){ if(!참)튕김++; 말.push((참?'OK  ':'🔴 FAIL ')+이름); }

var 항목 = [{원본:줄들[0].원본,줄:줄들[0],id:'od_1'},{원본:줄들[1].원본,줄:줄들[1],id:'od_2'}];
var 홍 = '홍길동|06000|01011112222';       // 08i.그룹키 = 이름+우편번호+전화(숫자만)
var 김 = '김철수|48000|01033334444';
var J=9, K=10, 이름칸=13;
function 줄뽑기(){ return ZG.로젠파일.준비(항목, {묶음id:'260810-01'}).표; }
function 사람(표, 이름){ return 표.filter(function(r){ return r[이름칸]===이름; }); }

/* 🔴 로젠 규칙 (우람님 8/31 실물 확인)
     · 합포장기준 = 이름＋연락처＋주소 → 이름이 같으면 한 송장으로 묶인다
     · K열(택배수량)에 값이 있는 줄은 따로 떼어져 그 안에서 운임이 나뉜다 → 절대 쓰지 않는다
     · 박스를 더 보내려면 이름 뒤에 번호를 붙인 「덧줄」을 그만큼 더 만든다 */

/* ① 손대지 않은 상태 — 여태 나가던 파일과 한 글자도 달라지면 안 된다 */
var 표 = 줄뽑기(), ㅎ = 사람(표,'홍길동');
봐('손질 없음 → 줄 하나 (실제: '+ㅎ.length+')', ㅎ.length===1);
봐('손질 없음 → J=2750 (실제: '+ㅎ[0][J]+')', ㅎ[0][J]==='2750');
봐('🔴 K열은 언제나 빈칸 (실제: "'+ㅎ[0][K]+'")', ㅎ[0][K]==='');

/* ② 2750 × 2박스 — 송장 두 장, 각 2750 (우람님 8/31 확정) */
ZG.운임손질.저장('260810-01', 홍, 1, {수령인:'홍길동', 단가:2750, 박스수:2, 자동값:'2750'});
표 = 줄뽑기();
봐('2750×2 → 홍길동 1장 + 홍길동2 1장 (실제: '+사람(표,'홍길동').length+' · '+사람(표,'홍길동2').length+')',
   사람(표,'홍길동').length===1 && 사람(표,'홍길동2').length===1);
봐('두 장 다 J=2750 · K빈칸 (실제: '+사람(표,'홍길동')[0][J]+'/'+사람(표,'홍길동2')[0][J]
   +' · "'+사람(표,'홍길동')[0][K]+'"/"'+사람(표,'홍길동2')[0][K]+'")',
   사람(표,'홍길동')[0][J]==='2750' && 사람(표,'홍길동2')[0][J]==='2750'
   && 사람(표,'홍길동')[0][K]==='' && 사람(표,'홍길동2')[0][K]==='');
봐('덧줄 품목명 = 홍길동_추가1 (실제: "'+사람(표,'홍길동2')[0][4]+'")',
   사람(표,'홍길동2')[0][4]==='홍길동_추가1');
봐('덧줄은 판매가·수량·옵션추가를 지운다 (실제: '+사람(표,'홍길동2')[0][11]+'·'
   +사람(표,'홍길동2')[0][12]+'·'+사람(표,'홍길동2')[0][25]+')',
   사람(표,'홍길동2')[0][11]==='0' && 사람(표,'홍길동2')[0][12]==='1' && 사람(표,'홍길동2')[0][25]==='0');
봐('손 안 댄 다른 손님은 그대로 (실제: '+사람(표,'김철수')[0][J]+' · "'+사람(표,'김철수')[0][K]+'")',
   사람(표,'김철수')[0][J]==='2750' && 사람(표,'김철수')[0][K]==='');

/* ③ 2750 × 4박스 → 홍길동 · 홍길동2 · 홍길동3 · 홍길동4 */
ZG.운임손질.저장('260810-01', 홍, 1, {수령인:'홍길동', 단가:2750, 박스수:4, 자동값:'2750'});
표 = 줄뽑기();
봐('2750×4 → 송장 4장 (실제: '+[1,2,3,4].map(function(n){return 사람(표,'홍길동'+(n>1?n:'')).length;}).join('+')+')',
   [1,2,3,4].every(function(n){ return 사람(표,'홍길동'+(n>1?n:'')).length===1; }));
봐('넷 다 J=2750 — 곱하지 않는다', [1,2,3,4].every(function(n){ return 사람(표,'홍길동'+(n>1?n:''))[0][J]==='2750'; }));
봐('품목명 = 홍길동_추가1·2·3 (실제: '+[2,3,4].map(function(n){return 사람(표,'홍길동'+n)[0][4];}).join(' · ')+')',
   [2,3,4].every(function(n){ return 사람(표,'홍길동'+n)[0][4]==='홍길동_추가'+(n-1); }));

/* ④ 박스수 1로 되돌리면 덧줄이 사라진다 */
ZG.운임손질.저장('260810-01', 홍, 1, {수령인:'홍길동', 단가:3300, 박스수:1, 자동값:'2750'});
표 = 줄뽑기();
봐('3300×1 → 홍길동 한 장뿐 (실제: '+사람(표,'홍길동').length+'장 · 홍길동2 '+사람(표,'홍길동2').length+'장)',
   사람(표,'홍길동').length===1 &&사람(표,'홍길동2').length===0);
봐('3300×1 → J=3300 · K빈칸', 사람(표,'홍길동')[0][J]==='3300' && 사람(표,'홍길동')[0][K]==='');

/* ⑤ 「송장 한 장 더」도 같은 모양이다 — 김철수 · 김철수2 */
ZG.운임손질.저장('260810-01', 김, 2, {수령인:'김철수', 단가:2750, 박스수:1, 자동값:'2750'});
표 = 줄뽑기();
봐('송장 한 장 더 → 김철수2 한 장 (실제: '+사람(표,'김철수2').length+')', 사람(표,'김철수2').length===1);
봐('김철수2 품목명 = 김철수_추가1 · J=2750 (실제: "'+사람(표,'김철수2')[0][4]+'" · '+사람(표,'김철수2')[0][J]+')',
   사람(표,'김철수2')[0][4]==='김철수_추가1' && 사람(표,'김철수2')[0][J]==='2750');

/* ⑥ 「송장 한 장 더」에 박스수까지 주면 번호가 이어진다 — 김철수 · 김철수2 · 김철수3 */
ZG.운임손질.저장('260810-01', 김, 2, {수령인:'김철수', 단가:2750, 박스수:2, 자동값:'2750'});
표 = 줄뽑기();
봐('번호가 겹치지 않고 이어진다 (실제: '+['','2','3'].map(function(n){return 사람(표,'김철수'+n).length;}).join('+')+')',
   ['','2','3'].every(function(n){ return 사람(표,'김철수'+n).length===1; }));

/* ⑦ 🔴 합포장(한 사람 2품목) + 3박스 — 조혜숙 건. 품목 줄은 그대로 2줄, 덧줄이 2줄 */
var 조원본1 = 원본('20260810-0000004','버들마편초','VER01-15',5,'조혜숙','13500','경기 성남 4','010-7777-8888');
var 조원본2 = 원본('20260810-0000005','무늬버들','SAL01-15',5,'조혜숙','13500','경기 성남 4','010-7777-8888');
function 조줄(id, 코드, 이름, 원){ return {id:id, 묶음id:'260810-01', 주문번호:원[2], 주문일:'2026-08-10', 판매처:'쿠팡',
  품목코드:코드, 원본코드:코드, 유통명:이름, 규격:'15cm', 주문수량:5, 옵션입수:1, 단가:9900,
  수령인:'조혜숙', 수령인전화:'010-7777-8888', 수령인주소:'경기 성남 4', 우편번호:'13500',
  묶음키:'조혜숙|010-7777-8888', 출처:'자동수집', 카페24상태:'배송준비중', 원본:원}; }
항목.push({원본:조원본1, 줄:조줄('od_4','VER01-15','버들마편초',조원본1), id:'od_4'});
항목.push({원본:조원본2, 줄:조줄('od_5','SAL01-15','무늬버들',조원본2), id:'od_5'});
ZG.운임손질.저장('260810-01', '조혜숙|13500|01077778888', 1, {수령인:'조혜숙', 단가:2750, 박스수:3, 자동값:'2750'});
표 = 줄뽑기();
var 조1 = 사람(표,'조혜숙');
봐('품목 줄은 그대로 2줄 (실제: '+조1.length+')', 조1.length===2);
봐('두 줄 다 이름 그대로 조혜숙 → 로젠이 한 송장으로 묶는다', 조1.length===2);
봐('두 줄 다 K빈칸 (실제: "'+조1.map(function(r){return r[K];}).join('" "')+'")',
   조1.every(function(r){ return r[K]===''; }));
봐('두 줄 다 J=2750 — 곱하지 않는다 (실제: '+조1.map(function(r){return r[J];}).join(' · ')+')',
   조1.every(function(r){ return r[J]==='2750'; }));
봐('덧줄 2장 = 조혜숙2 · 조혜숙3 (실제: '+사람(표,'조혜숙2').length+'+'+사람(표,'조혜숙3').length+')',
   사람(표,'조혜숙2').length===1 && 사람(표,'조혜숙3').length===1);
봐('덧줄 품목명 = 조혜숙_추가1 · 조혜숙_추가2 (실제: "'+사람(표,'조혜숙2')[0][4]+'" "'+사람(표,'조혜숙3')[0][4]+'")',
   사람(표,'조혜숙2')[0][4]==='조혜숙_추가1' && 사람(표,'조혜숙3')[0][4]==='조혜숙_추가2');
봐('🔴 조혜숙에게 나갈 송장은 모두 3장 (실제: '+(1+2)+'장 · 파일 줄 '+(조1.length+2)+')',
   조1.length===2 && 사람(표,'조혜숙2').length+사람(표,'조혜숙3').length===2);

/* ⑧ 27칸이 그대로여야 한다 */
봐('27칸 수가 그대로 27 (실제: '+표[0].length+')', 표.every(function(r){ return r.length===27; }));

document.getElementById('말').textContent = 말.join('\n')+'\n\n'+(튕김?'🔴 '+튕김+'건 실패':'✅ 전부 통과');
</script>
