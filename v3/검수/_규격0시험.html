<!doctype html><meta charset="utf-8"><title>규격 0 시험</title>
<body><pre id="out">돌기 전</pre>
<script src="../js/02-품목코드.js"></script>
<script>
var 코 = window.ZG.품목코드, 통과=0, 실패=0, 줄=[];
function T(설명, 실제, 기대){
  var ok = JSON.stringify(실제)===JSON.stringify(기대);
  if(ok){ 통과++; } else { 실패++; 줄.push('✗ '+설명+'\n    실제: '+JSON.stringify(실제)+'\n    기대: '+JSON.stringify(기대)); }
}
var N = function(v){ return 코.규격정규화(v); };

/* ── 0 = 규격 외 ── */
T('0 → 규격 외', N('0'), {규격cm:0, 규격:'규격 외'});
T('되먹임: 「규격 외」 다시 넣기', N('규격 외'), {규격cm:0, 규격:'규격 외'});
T('규격이름(0)', 코.규격이름(0), '규격 외');
T("규격이름('0') 문자열도", 코.규격이름('0'), '규격 외');
T('단추 라벨 0', 코.규격이름(0).replace(/cm 포트$/,'cm'), '규격 외');

/* ── 기존 숫자 규격이 그대로인가 ── */
T('15 그대로', N('15'), {규격cm:15, 규격:'15cm 포트'});
T('되먹임: 15cm 포트', N('15cm 포트'), {규격cm:15, 규격:'15cm 포트'});
T('5치 → 15cm 포트', N('5치'), {규격cm:15, 규격:'15cm 포트'});
T('999 통과', N('999').규격cm, 999);
T('1000 거절', !!N('1000').오류, true);
T('규격이름(15)', 코.규격이름(15), '15cm 포트');
T('단추 라벨 15', 코.규격이름(15).replace(/cm 포트$/,'cm'), '15cm');

/* ── 여전히 거절해야 하는 것 ── */
T('빈칸 거절', !!N('').오류, true);
T('공백만 거절', !!N('   ').오류, true);
T('뿌리묘 거절', !!N('뿌리묘').오류, true);
T('1년생 거절', !!N('1년생').오류, true);
T('거절 문구에 0 안내가 있다', /0/.test(N('뿌리묘').오류||''), true);
T('음수 거절', !!N('-5').오류, true);

/* ── 품목코드 꼬리 -0 ── */
T('새 식물 코드 -0', 코.코드계산("Tulipa 'Rosy Delight'", 0, []).코드, 'TUR01-0');
T('새 식물 코드 -15', 코.코드계산("Tulipa 'Rosy Delight'", 15, []).코드, 'TUR01-15');
var 키 = 코.학명키("Tulipa 'Rosy Delight'");
var 품목15 = [{학명3:'TUR', 학명키:키, 일련번호:'01', 규격cm:15}];
T('같은 식물, 0 은 새 규격 → 확인필요', 코.코드계산("Tulipa 'Rosy Delight'", 0, 품목15).상태, '확인필요');
T('  그 확정코드가 -0', 코.코드계산("Tulipa 'Rosy Delight'", 0, 품목15).확정코드, 'TUR01-0');
var 품목0 = [{학명3:'TUR', 학명키:키, 일련번호:'01', 규격cm:0}];
T('0 이 이미 있으면 이미있음', 코.코드계산("Tulipa 'Rosy Delight'", 0, 품목0).상태, '이미있음');
T('0 있는데 15 넣으면 확인필요', 코.코드계산("Tulipa 'Rosy Delight'", 15, 품목0).상태, '확인필요');

/* ── 0 은 falsy 다. 그냥 넘어가는지 확인해야 할 자리들 ── */
T('05a·05c 의 (규격cm == null) 이 0 을 안 잡는다', 0 == null, false);
T('05a 직접켜짐: 0 은 기본 규격목록에 없다', [10,15,18,21,27].indexOf(0), -1);
T('08k 빈칸은 NaN → 거절', !(NaN >= 0), true);
T('08k 0 은 통과', (0 >= 0), true);
T('08c 코드꼬리 파싱: TUR01-0 → 0', Number('TUR01-0'.split('-')[1]) || 0, 0);
T('04 정렬: 0 이 맨 앞', [15,0,27].sort(function(a,b){return a-b;}), [0,15,27]);

document.getElementById('out').textContent = (줄.length? 줄.join('\n')+'\n\n':'') + '통과 ' + 통과 + ' · 실패 ' + 실패;
</script></body>
