<!doctype html><meta charset="utf-8"><title>동봉카드 만들기 전 손질창 — 시험</title>
<link rel="stylesheet" href="../css/공통.css"><link rel="stylesheet" href="../css/주문.css">
<body style="background:#fff">
<!-- 우람님 8/19 지시 — 「동봉카드 만들 때 품목이 안 붙어 빈칸으로 나가는 것·특성 빠진 것을
     그 자리서 짝 짓고 채우게」. 손질창이 뜨는 조건과, 고친 것이 실제로 붙는지를 본다. -->
<pre id=말 style="font:13px/1.7 ui-monospace,monospace;padding:16px"></pre>
<div id=앱 style="display:none"></div>
<script>
localStorage.clear();
localStorage.setItem('zg.v3.품목', JSON.stringify([
  /* 특성 7칸이 다 찬 품목 — 이것만 있는 주문은 손질창이 뜨면 안 된다 */
  { 품목코드:'ALP02-15', 접두:'ALP02', 학명3:'ALP', 일련번호:'02', 규격cm:15, 규격:'15cm 포트',
    유통명:'알프스민들레', 학명:'Alpina alpina', 학명키:'alpina alpina', 매입단가:1000,
    과세구분:'면세', 상태:'판매중',
    특성:{ 최대높이:'30', 최대너비:'25', 내한성:'Zone5', 물주기:'보통', 햇빛:'양지',
           개화기:'6~9월', 관리특이사항:'배수가 관건입니다.' } },
  /* 특성이 몇 칸 빈 품목 — 손질창에 「빈 칸」으로 떠야 한다 */
  { 품목코드:'TOM01-15', 접두:'TOM01', 학명3:'TOM', 일련번호:'01', 규격cm:15, 규격:'15cm 포트',
    유통명:'토마토', 학명:'Solanum lycopersicum', 학명키:'solanum lycopersicum', 매입단가:900,
    과세구분:'면세', 상태:'판매중', 특성:{ 최대높이:'150' } }
]));
localStorage.setItem('zg.v3.심폴짝', JSON.stringify([]));
</script>
<script src="../js/01-저장소.js"></script>
<script src="../js/02-품목코드.js"></script>
<script src="../js/03-계산.js"></script>
<script src="../js/04-공통UI.js"></script>
<script src="../js/04b-특성.js"></script>
<script src="../js/08a-주문자료.js"></script>
<script src="../js/08c-주문입력.js"></script>
<script src="../js/08j-심폴.js"></script>
<script src="../js/08k-심폴짝창.js"></script>
<script src="../js/09-동봉카드.js"></script>
<script>
var 말 = document.getElementById('말'), 실패 = 0;
function 봐(제목, 됐나) {
  말.textContent += (됐나 ? '✅ ' : '❌ ') + 제목 + '\n';
  if (!됐나) 실패++;
}
function 줄(추가) {
  var r = { id:'od_'+Math.random().toString(36).slice(2), 묶음id:'m1', 주문번호:'20260819-1',
    주문일:'2026-08-19', 판매처:'카페24', 주문수량:1, 옵션입수:1, 단가:9900,
    수령인:'홍길동', 수령인전화:'010-1111-2222', 수령인주소:'서울 강남구 1', 우편번호:'06000',
    묶음키:'홍길동|010-1111-2222', 출처:'자동수집' };
  Object.keys(추가).forEach(function (k) { r[k] = 추가[k]; });
  return r;
}
function 건들로(줄들) {
  localStorage.setItem('zg.v3.주문', JSON.stringify(줄들));
  return ZG.주문자료.건으로묶기(줄들);
}
function 창있나() { return !!document.querySelector('.pcsheet'); }
function 카드수() { return document.querySelectorAll('.encardframe').length; }
function 손질창인가() {
  var h = document.querySelector('.pcsheet .hd h3');
  return !!h && h.textContent.indexOf('손질') >= 0;
}

/* ── ① 특성이 다 찬 주문 하나 — 손질할 게 없으니 카드가 바로 나와야 한다 ── */
ZG.동봉카드.열기(건들로([줄({ 품목코드:'ALP02-15', 원본코드:'ALP02-15', 유통명:'알프스민들레', 규격:'15cm' })]));
봐('① 손질할 게 없으면 손질창 없이 카드가 바로 나온다', !손질창인가() && 카드수() === 1);
ZG.주문입력.닫기창();

/* ── ② 품목이 안 붙은 줄 — 카드 대신 손질창이 먼저 떠야 한다 ── */
var 못붙은 = [줄({ 품목코드:'', 원본코드:'000000000012345678', 유통명:'심폴 무늬버들', 판매처:'심폴' })];
var 건들2 = 건들로(못붙은);
ZG.동봉카드.열기(건들2);
봐('② 품목이 안 붙은 줄이 있으면 손질창이 뜬다 (카드는 아직 안 나온다)', 손질창인가() && 카드수() === 0);
봐('②-1 손질창 안에 짝짓기 상자가 들어 있다', !!document.querySelector('.pcsheet .needbox'));

/* ── ③ 손질창에서 짝을 지으면 — 저장된 줄에도, 손에 든 건들에도 품목이 붙는다 ── */
ZG.짝.짝쓰기('000000000012345678', 'TOM01-15', '심폴 무늬버들');
ZG.짝.저장된줄되붙이기();
ZG.짝.되붙이기([{ 줄: 못붙은[0], 상품명: '심폴 무늬버들' }]);
봐('③ 짝을 지으면 손에 든 줄에 품목이 붙는다', 못붙은[0].품목코드 === 'TOM01-15' && 못붙은[0].유통명 === '토마토');
봐('③-1 저장된 줄에도 붙는다 — 창을 닫아도 남는다',
   JSON.parse(localStorage.getItem('zg.v3.주문'))[0].품목코드 === 'TOM01-15');
ZG.주문입력.닫기창();

/* ── ④ 짝은 지었지만 그 품목의 특성이 비었다 — 그래도 손질창이 떠야 한다 ── */
var 건들4 = 건들로([줄({ 품목코드:'TOM01-15', 원본코드:'000000000012345678', 유통명:'토마토', 규격:'15cm' })]);
var 거리 = ZG.동봉카드.손질거리(건들4);
봐('④ 특성이 빈 품목을 골라낸다', 거리.빈품목.length === 1 && 거리.빈품목[0].코드 === 'TOM01-15');
봐('④-1 어느 칸이 비었는지 이름으로 알려준다',
   거리.빈품목[0].빈칸.indexOf('최대 너비') >= 0 && 거리.빈품목[0].빈칸.indexOf('최대 높이') < 0);
ZG.동봉카드.열기(건들4);
봐('④-2 특성만 비어도 손질창이 뜬다', 손질창인가() && 카드수() === 0);

/* ── ⑤ 손질창에서 특성을 채우면 품목에 저장되고, 그 뒤엔 손질할 게 없어진다 ── */
ZG.저장소.바꾸기(ZG.저장소.키.품목, 'TOM01-15', { 특성: {
  최대높이:'150', 최대너비:'60', 내한성:'Zone9', 물주기:'자주', 햇빛:'양지',
  개화기:'6~8월', 관리특이사항:'지주를 세워 주세요.' } });
봐('⑤ 채운 특성이 품목에 저장된다',
   JSON.parse(localStorage.getItem('zg.v3.품목')).filter(function (p) {
     return p.품목코드 === 'TOM01-15'; })[0].특성.최대너비 === '60');
봐('⑤-1 다 채우면 손질할 게 없다', ZG.동봉카드.손질거리(건들4).할것 === false);
ZG.주문입력.닫기창();
ZG.동봉카드.열기(건들4);
봐('⑤-2 그 뒤엔 카드가 바로 나온다', !손질창인가() && 카드수() === 1);
ZG.주문입력.닫기창();

/* ── ⑥ 원본코드도 품목코드도 없는 줄 — 여기선 못 고치니 알리기만 한다 ── */
var 거리6 = ZG.동봉카드.손질거리(건들로([줄({ 품목코드:'', 원본코드:'', 유통명:'이름만 있는 줄' })]));
봐('⑥ 열쇠 없는 줄은 짝 대상이 아니라 「알림」으로 센다',
   거리6.짝수 === 0 && 거리6.열쇠없음.length === 1 && 거리6.할것 === true);

/* ── ⑦ 사무실인쇄·다시열기는 손질을 건너뛴다 (사람이 없는 자리다) ── */
봐('⑦ 그리기()는 손질창을 안 거친다', typeof ZG.동봉카드.그리기 === 'function');
ZG.동봉카드.그리기(건들로([줄({ 품목코드:'', 원본코드:'없는코드', 유통명:'빈 품목' })]));
봐('⑦-1 품목이 안 붙어도 그리기()는 카드를 그대로 뽑는다', !손질창인가() && 카드수() === 1);
ZG.주문입력.닫기창();

말.textContent += '\n' + (실패 ? '❌ ' + 실패 + '건 실패' : '✅ 전부 통과');
</script>
