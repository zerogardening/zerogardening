var 오늘 = new Date(), 날 = oj(오늘);
function oj(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function 줄(id, 이름, 옵) {
  var r = { id:id, 수령인:이름, 주문일:날, 등록일시:1, 판매처:'카페24', 주문번호:'N'+id,
            품목코드:'TOM01-15', 품목명:'토마토', 규격:'15cm', 수량:1, 단가:1000, 묶음키:'묶음-'+이름 };
  for (var k in (옵||{})) r[k] = 옵[k];
  return r;
}
localStorage.setItem('zg.v3.주문', JSON.stringify([
  줄('a1','김준비',{ 카페24상태:'배송준비중' }),                       // ① 아직 안 나갔다
  줄('b1','윤혜숙',{ 카페24상태:'배송준비중' }),                       // ② 🔴 손으로 배송완료 (출고 있음)
  줄('c1','박직접',{ 카페24상태:'배송완료' }),                          // ③ 카페24에서 직접 처리
  줄('d1','최사은',{ 카페24상태:'배송준비중' }),                       // ④ 상품줄 — 아직 안 나갔다
  줄('d2','최사은',{ 카페24상태:'배송준비중', 서비스:true, 품목코드:'GIF01' }), // ④ 서비스줄 (출고가 미리 있다)
  줄('e1','심폴손',{ 판매처:'심폴', 카페24상태:'' })                    // ⑤ 심폴 — 출고 있음
]));

  { id:'sh1', 주문id:'b1', 출처:'주문', 품목코드:'TOM01-15', 수량:1, 출고일:날, 수동:true },
  { id:'sh2', 주문id:'d2', 출처:'서비스', 품목코드:'GIF01', 수량:1, 출고일:날 },
  { id:'sh3', 주문id:'e1', 출처:'주문', 품목코드:'TOM01-15', 수량:1, 출고일:날 }
]));
</script>

<script>
window.addEventListener('load', function () {
  var 말 = [], 튕김 = 0;
  function 봐(이름, 참) { if (!참) 튕김++; 말.push((참 ? 'OK  ' : '🔴 FAIL ') + 이름); }

  var 상 = ZG.주문.상태;
  말.push('진단 — 폰인가:' + ZG.ui.폰인가() + ' · 저장소 주문 ' + ZG.저장소.읽기(ZG.저장소.키.주문).length +
          '줄 · 출고 ' + ZG.저장소.읽기(ZG.저장소.키.출고).length + '줄 · 오늘 ' + ZG.ui.오늘문자());

  상.부터 = '2020-01-01'; 상.까지 = '2099-12-31'; 상.글 = ''; 상.묶음id = '';

  function 이름들(칩) {
    상.상태칩 = 칩;

    return ZG.주문.줄들().map(function (r) { return r.수령인 + (r.서비스 ? '(서비스)' : ''); });
  }
  var 준비 = 이름들('준비중'), 나감 = 이름들('나감');
  말.push('배송준비중 → ' + 준비.join(', '));

  봐('① 안 나간 건은 배송준비중에 있다', 준비.indexOf('김준비') >= 0 && 나감.indexOf('김준비') < 0);

  봐('🔴 ② 손으로 넘긴 윤혜숙이 배송완료에 뜬다', 나감.indexOf('윤혜숙') >= 0);
  봐('③ 카페24에서 직접 처리한 건은 그대로 배송완료다', 나감.indexOf('박직접') >= 0 && 준비.indexOf('박직접') < 0);

  document.getElementById('말').textContent = 말.join('\n') + '\n\n' + (튕김 ? '🔴 ' + 튕김 + '건 실패' : '✅ 전부 통과');
});
