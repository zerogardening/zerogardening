<!doctype html><meta charset="utf-8"><title>카페24 「이미 발송처리」 시험</title>
<body style="padding:20px;background:#fff">
<!-- 우람님이 카페24에서 직접 배송완료하신 건 → 함수가 「이미 발송처리된 주문입니다」로 거절한다.
     그때 통합관리 주문줄도 배송완료로 맞추는지 (우람님 지시 8/10) -->
<pre id=말 style="font:13px/1.7 ui-monospace,monospace"></pre>
<script>
/* 저장소·서버를 가짜로 세운다 — 08l 은 이 둘만 쓴다 */
var 쓴것 = [];
window.ZG = {
  저장소: { 키: { 주문: '주문' }, 바꾸기: function (표, id, 값) { 쓴것.push({ id: id, 값: 값 }); } },
  서버: { 클라이언트: { functions: { invoke: function (이름, 옵) {
    /* edge-배송등록 index.ts:94~100 이 실제로 돌려주는 모양 그대로 */
    return Promise.resolve({ data: { ok: true, 결과: 옵.body.짝들.map(function (p) {
      if (p.주문번호 === 'A') return { 됨: true, 품목수: 2 };
      if (p.주문번호 === 'B') return { 됨: false, 사유: '이미 발송처리된 주문입니다 (배송완료)' };
      return { 됨: false, 사유: '카페24에 없는 주문번호입니다' };
    }) } });
  } } } }
};
</script>
<script src="../js/08l-카페24발송.js"></script>
<script>
var 말 = [], 튕김 = 0;
function 봐(이름, 참) { if (!참) 튕김++; 말.push((참 ? 'OK  ' : '🔴 FAIL ') + 이름); }

봐('「이미 발송처리된 주문입니다 (배송완료)」를 이미 나간 것으로 읽는다',
   ZG.카페24발송.이미나갔나('이미 발송처리된 주문입니다 (배송완료)') === true);
봐('「카페24에 없는 주문번호입니다」는 이미 나간 것이 아니다',
   ZG.카페24발송.이미나갔나('카페24에 없는 주문번호입니다') === false);
봐('빈 사유는 이미 나간 것이 아니다', ZG.카페24발송.이미나갔나('') === false);

/* 대상뽑기 — 카페24상태가 이미 배송완료면 애초에 꺼져 나온다 */
var 뽑 = ZG.카페24발송.대상뽑기([
  { 순번: 1, 판정: '정상', 주문번호: 'A', 운송장번호: '1', 주문줄들: [{ id: 'a1', 출처: '자동수집', 카페24상태: '배송준비중' }] },
  { 순번: 2, 판정: '정상', 주문번호: 'B', 운송장번호: '2', 주문줄들: [{ id: 'b1', 출처: '자동수집', 카페24상태: '배송준비중' }] },
  { 순번: 3, 판정: '정상', 주문번호: 'C', 운송장번호: '3', 주문줄들: [{ id: 'c1', 출처: '자동수집', 카페24상태: '배송준비중' }] }
]);
봐('보낼 대상 3건', 뽑.짝들.length === 3);

ZG.카페24발송.보내기(뽑.짝들, false).then(function (결과들) {
  var A = 결과들[0], B = 결과들[1], C = 결과들[2];
  봐('A(정상)는 됨:true · 이미:false', A.됨 === true && A.이미 === false);
  봐('🔴 B(카페24에서 직접 배송완료)는 이미:true', B.이미 === true);
  봐('C(없는 주문번호)는 이미:false — 진짜 실패다', C.됨 === false && C.이미 === false);

  /* 08m 이 하는 일 그대로 — 이미:true 인 줄만 모아 되쓴다 */
  var 번호 = {};
  결과들.forEach(function (r) { if (r.이미) 번호[r.짝.주문번호] = 1; });
  var 센수 = ZG.카페24발송.상태되쓰기(뽑.짝들, 번호);

  봐('🔴 B 주문줄 1개만 되썼다', 센수 === 1 && 쓴것.length === 1);
  봐('🔴 B 를 카페24상태 「배송완료」로 맞췄다',
     쓴것[0] && 쓴것[0].id === 'b1' && 쓴것[0].값.카페24상태 === '배송완료');
  봐('A·C 는 손대지 않았다', 쓴것.every(function (x) { return x.id === 'b1'; }));

  document.getElementById('말').textContent = 말.join('\n') + '\n\n' + (튕김 ? '🔴 ' + 튕김 + '건 실패' : '✅ 전부 통과');
});
</script>
