<link rel="stylesheet" href="../css/공통.css"><link rel="stylesheet" href="../css/주문.css">
<body style="background:#fff">
<!-- 우람님 8/10 지시 — 「주문수집·동봉카드에서 품목이 안 붙으면 짝을 지어 기억하고 다음엔 저절로」.
     8/8에 심폴 전용으로 만든 짝표를 판매처 무관으로 넓혔다. 회귀(심폴)와 새 동작(카페24)을 같이 본다. -->
<pre id=말 style="font:13px/1.7 ui-monospace,monospace;padding:16px"></pre>
<div id=앱 style="display:none"></div>
<script>
localStorage.clear();
localStorage.setItem('zg.v3.품목', JSON.stringify([
  { 품목코드:'ALP02-15', 접두:'ALP02', 학명3:'ALP', 일련번호:'02', 규격cm:15, 규격:'15cm 포트',
    유통명:'알프스민들레', 학명:'Alpina alpina', 학명키:'alpina alpina', 매입단가:1000,
    과세구분:'면세', 상태:'판매중', 특성:{ 최대높이:'30', 물주기:'보통' } },
  { 품목코드:'TOM01-15', 접두:'TOM01', 학명3:'TOM', 일련번호:'01', 규격cm:15, 규격:'15cm 포트',
    유통명:'토마토', 학명:'Solanum lycopersicum', 학명키:'solanum lycopersicum', 매입단가:900,
    과세구분:'면세', 상태:'판매중', 특성:{ 최대높이:'150' } }
]));
localStorage.setItem('zg.v3.심폴짝', JSON.stringify([]));
</script>
<script src="../js/01-저장소.js"></script>
<script src="../js/02-품목코드.js"></script>
<script src="../js/03-계산.js"></script>

<script src="../js/08a-주문자료.js"></script>
<script src="../js/08c-주문입력.js"></script>
<script src="../js/08j-심폴.js"></script>
<script src="../js/08k-심폴짝창.js"></script>
<script src="../js/09-동봉카드.js"></script>
<script>
window.addEventListener('load', function () {
  var 말 = [], 튕김 = 0;
  function 봐(이름, 참) { if (!참) 튕김++; 말.push((참 ? 'OK   ' : '🔴 FAIL ') + 이름); }
  function 것(줄, 상품명) { return { 줄: 줄, 상품명: 상품명 || '' }; }
  function 카페(코드, 품목코드) {
    return { id:'x', 판매처:'카페24', 원본코드:코드, 품목코드:품목코드||'', 유통명:'', 학명:'', 규격:'' };
  }
  function 심폴(코드) {
    return { id:'y', 판매처:'심폴', 원본코드:코드, 품목코드:'', 유통명:'', 학명:'', 규격:'' };
  }

  /* ── ① 짝이 없으면 못 붙은 카페24 줄을 건드리지 않는다 ── */
  var a = 카페('ALP02');
  ZG.짝.되붙이기([것(a, '알프스민들레 15cm')]);
  봐('① 짝 없음 — 카페24 미매칭 줄은 그대로 빈칸', a.품목코드 === '');

  /* ── ② 짝을 지으면 붙는다 ── */
  ZG.짝.짝쓰기('ALP02', 'ALP02-15', '알프스민들레 15cm');
  var b = 카페('ALP02');
  ZG.짝.되붙이기([것(b, '알프스민들레 15cm')]);
  봐('② 짝 지은 뒤 — 카페24 줄에 품목이 붙는다', b.품목코드 === 'ALP02-15');
  봐('②  유통명·규격까지 v3 것으로 바뀐다', b.유통명 === '알프스민들레' && b.규격 === '15cm 포트');

  /* ── ③ 이미 저절로 붙은 줄은 짝이 있어도 안 덮는다 ── */
  var c = 카페('ALP02', 'TOM01-15');
  c.유통명 = '토마토';
  ZG.짝.되붙이기([것(c)]);
  봐('③ 저절로 붙은 카페24 줄은 짝이 못 덮는다', c.품목코드 === 'TOM01-15' && c.유통명 === '토마토');

  /* ── ④ 심폴은 여태 그대로 — 짝이 곧 전부다 (회귀) ── */
  ZG.짝.짝쓰기('000000000012345678', 'TOM01-15', '심폴토마토');
  var d = 심폴('000000000012345678');
  ZG.짝.되붙이기([것(d, '심폴토마토')]);
  봐('④ 심폴 — 짝대로 붙는다 (회귀)', d.품목코드 === 'TOM01-15');
  ZG.짝.짝풀기('000000000012345678');
  ZG.짝.되붙이기([것(d, '심폴토마토')]);
  봐('④ 심폴 — 짝을 풀면 다시 비고 원본 상품명이 남는다',
     d.품목코드 === '' && d.유통명 === '심폴토마토');

  /* ── ⑤ 원본코드가 빈칸이면 기억할 열쇠가 없다 ── */
  var e = 카페('');
  ZG.짝.되붙이기([것(e, '코드없는상품')]);
  봐('⑤ 원본코드 빈칸 — 아무 일도 안 일어난다', e.품목코드 === '');

  /* ── ⑥ 자동수집: 이미 저장된 줄에 뒤늦게 붙는다 ── */
  var 저 = ZG.저장소;
  저.저장 ? 0 : 0;
  localStorage.setItem('zg.v3.주문', JSON.stringify([
    { id:'o1', 판매처:'카페24', 원본코드:'ALP02', 품목코드:'', 유통명:'카페24상품명', 주문일:'2026-08-10' },
    { id:'o2', 판매처:'카페24', 원본코드:'ALP02', 품목코드:'TOM01-15', 유통명:'토마토', 주문일:'2026-08-10' },
    { id:'o3', 판매처:'카페24', 원본코드:'', 품목코드:'', 유통명:'코드없음', 주문일:'2026-08-10' }
  ]));
  if (저.새로읽기) 저.새로읽기();
  var 붙 = ZG.짝.저장된줄되붙이기();
  var 주문 = 저.읽기(저.키.주문);
  function 찾(id) { return 주문.filter(function (r) { return r.id === id; })[0] || {}; }
  봐('⑥ 저장된 미매칭 줄 1개만 붙었다 (돌려준 수 ' + 붙 + ')', 붙 === 1);
  봐('⑥  o1 에 품목이 붙었다', 찾('o1').품목코드 === 'ALP02-15');
  봐('⑥  이미 붙은 o2 는 그대로', 찾('o2').품목코드 === 'TOM01-15');
  봐('⑥  코드 없는 o3 는 그대로', 찾('o3').품목코드 === '');
  봐('⑥ 두 번 돌려도 더 안 붙는다 (헛돌지 않는다)', ZG.짝.저장된줄되붙이기() === 0);

  /* ── ⑦ 동봉카드 — 품목이 붙으면 특성이 따라온다 (우람님이 실제로 보시는 결과) ── */
  var 판들 = ZG.동봉카드 && ZG.동봉카드.기본설정 ? 1 : 0;
  var 특성 = null;
  ZG.저장소.품목들().forEach(function (p) { if (p.품목코드 === 'ALP02-15') 특성 = p.특성; });
  봐('⑦ 붙은 품목에 특성이 있다 → 동봉카드가 빈칸이 아니다', !!(특성 && 특성.최대높이));

  /* ── ⑧ 짝창 — 다 붙은 카페24 파일이면 아무것도 안 그린다 ── */
  var 다붙음 = ZG.짝창.상자([것(카페('TOM01', 'TOM01-15'))], { 바뀌면: function () {} });
  봐('⑧ 다 붙은 카페24 — 짝짓기 상자를 안 띄운다 (null)', 다붙음 === null);

  /* ── ⑨ 짝창 — 못 붙은 줄이 있으면 상자를 준다 ── */
  var 상자 = ZG.짝창.상자([것(카페('NEW99'), '처음보는식물')], { 바뀌면: function () {} });
  봐('⑨ 못 붙은 카페24 — 짝짓기 상자를 띄운다', !!상자);
  봐('⑨  「새로 등록」 접이칸이 함께 있다',
     !!(상자 && 상자.textContent.indexOf('여기서 새로 등록') >= 0));
  봐('⑨  원본코드 빈칸 줄은 짝창에 안 뜬다',
     ZG.짝창.상자([것(카페(''), '코드없는상품')], { 바뀌면: function () {} }) === null);

  /* ── ⑩ 새 품목 코드 계산 — 「없는 식물 새로 등록」이 기대대로 코드를 만드나 ── */
  var 계 = ZG.품목코드.코드계산('Anemone hupehensis', 15, ZG.저장소.품목들());
  봐('⑩ 처음 보는 식물 → 새 코드가 나온다 (' + (계.코드 || 계.상태) + ')',
     계.상태 === '새것' && /^ANE01-15$|^[A-Z]{3}01-15$/.test(계.코드));
  var 계2 = ZG.품목코드.코드계산('Alpina alpina', 15, ZG.저장소.품목들());
  봐('⑩ 이미 있는 식물·규격 → 새로 안 만들고 그 코드를 쓴다',
     계2.상태 === '이미있음' && 계2.코드 === 'ALP02-15');

  말.push('');
  말.push(튕김 ? ('🔴 ' + 튕김 + '개 실패') : '✅ 전부 통과 (' + (말.length - 1) + '항목)');
  document.getElementById('말').textContent = 말.join('\n');
});
</script>
